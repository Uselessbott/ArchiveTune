name: Build Single APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v6

      - run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleGmsMobileUniversalRelease
        env:
          API_BEARER_TOKEN: ${{ secrets.API_BEARER_TOKEN }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          TOGETHER_BEARER_TOKEN: ${{ secrets.TOGETHER_BEARER_TOKEN }}
          CANVAS_BEARER_TOKEN: ${{ secrets.CANVAS_BEARER_TOKEN }}
          EXTRACTOR_BEARER: ${{ secrets.EXTRACTOR_BEARER }}
          START_IO_APP_ID: ${{ secrets.START_IO_APP_ID }}

      - uses: actions/upload-artifact@v4
        with:
          name: ArchiveTune-GMS-Mobile-Universal-Release
          path: |
            app/build/outputs/apk/gms/mobile/universal/release/*.apk
            app/build/outputs/apk/gmsMobileUniversal/release/*.apk
            app/build/outputs/apk/mobile/universal/release/*.apk
            app/build/outputs/apk/mobileUniversal/release/*.apk
