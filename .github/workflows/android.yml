name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Verify submodules
        run: |
          echo "=== Git Submodules ==="
          git submodule status

          echo
          echo "=== Lyrics directory ==="
          ls -la lyrics || true

          echo
          echo "=== BetterLyrics directory ==="
          ls -la lyrics/betterlyrics || true

          echo
          echo "=== BetterLyrics tree ==="
          find lyrics/betterlyrics -maxdepth 2 || true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ArchiveTune-debug
          path: app/build/outputs/apk/debug/*.apk
